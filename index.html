<style>
/* raspored: uređaj i terarij jedan pored drugog, na mobitelu jedno ispod drugog; ispod klizač doba dana */
:root {
    --pozadina: #f6f5f1;
    --kartica: #ffffff;
    --tekst: #1f2a24;
    --prigušeno: #5b6b61;
    --naglasak: #2f6b4f;
    --mreza: #e3e2dd;
    --sjena: 0 1px 2px rgba(31,42,36,.06), 0 8px 24px rgba(31,42,36,.07);
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --pozadina: #141a17; --kartica: #1b2320; --tekst: #e6ebe7; --prigušeno: #9aa9a0;
        --naglasak: #7cc4a0; --mreza: #2a332f; --sjena: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
        color-scheme: dark;
    }
}
:root[data-theme="dark"] {
    --pozadina: #141a17; --kartica: #1b2320; --tekst: #e6ebe7; --prigušeno: #9aa9a0;
    --naglasak: #7cc4a0; --mreza: #2a332f; --sjena: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    background: var(--pozadina);
    color: var(--tekst);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
}
.okvir { max-width: 1060px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 16px; }
header h1 { margin: 0; color: var(--naglasak); font-size: 1.35rem; text-wrap: balance; }
header p { margin: 2px 0 0; color: var(--prigušeno); font-size: .88rem; }
.mreza { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.kartica { background: var(--kartica); border-radius: 16px; padding: 16px; box-shadow: var(--sjena); min-width: 0; }
.kartica h2 { margin: 0 0 12px; font-size: .78rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--prigušeno); }

/* ---- uređaj ---- */
.kucište { background: linear-gradient(160deg, #3a403d, #222725); border-radius: 22px; padding: 16px;
           display: flex; gap: 14px; align-items: center; box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 10px 30px rgba(0,0,0,.25); }
.bezel { background: #050808; border-radius: 10px; padding: 8px; flex: 1; min-width: 0;
         box-shadow: inset 0 0 0 1px #000, inset 0 2px 6px rgba(0,0,0,.8); }
#ekran { display: block; width: 100%; max-width: 100%; aspect-ratio: 4 / 3; border-radius: 4px; }
.natpis { color: #8d9792; font-size: .68rem; letter-spacing: .14em; text-align: center; margin-top: 8px; }
.tipke { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.tipka { width: 50px; height: 50px; border-radius: 50%; border: none; cursor: pointer; padding: 0;
         touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
         -webkit-tap-highlight-color: transparent;
         background: radial-gradient(circle at 35% 30%, #5b625f, #2b302e 70%); color: #cfd8d3; font: 600 1.1rem/1 -apple-system, sans-serif;
         box-shadow: 0 3px 0 #111, 0 4px 10px rgba(0,0,0,.4); transition: transform .05s, box-shadow .05s; }
.tipka:focus-visible { outline: 2px solid #7cc4a0; outline-offset: 3px; }
.tipka.ok { font-size: .8rem; letter-spacing: .05em; background: radial-gradient(circle at 35% 30%, #4f7a66, #24392f 70%); }
.tipka.natrag { margin-top: 6px; background: radial-gradient(circle at 35% 30%, #6b5a4b, #3a2f27 70%); }
.tipka.pritisnuta { transform: translateY(2px); box-shadow: 0 1px 0 #111, 0 2px 4px rgba(0,0,0,.4); }
.savjet { margin: 12px 0 0; font-size: .82rem; color: var(--prigušeno); }

/* ---- terarij ---- */
.terarij { display: block; width: 100%; max-width: 100%; height: auto; border-radius: 12px; }
.terarij .prijelaz { transition: opacity .4s, fill .4s, stop-color .4s; }

/* ---- doba dana ---- */
.doba { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 16px; align-items: center; }
.doba .sat { font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.doba .datum { font-size: .8rem; color: var(--prigušeno); }
#klizac { width: 100%; accent-color: var(--naglasak); height: 32px; }
.oznake { grid-column: 2; display: flex; justify-content: space-between; font-size: .72rem; color: var(--prigušeno); font-variant-numeric: tabular-nums; }

@media (max-width: 760px) {
    .mreza { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
    .kucište { flex-direction: column; padding: 12px; gap: 12px; }
    .bezel { width: 100%; }
    .tipke { flex-direction: row; justify-content: center; gap: 14px; }
    .tipka { width: 56px; height: 56px; }
    .tipka.natrag { margin: 0 0 0 8px; }
    .doba { grid-template-columns: 1fr; }
    .oznake { grid-column: 1; }
}
@media (prefers-reduced-motion: reduce) { .terarij .prijelaz, .tipka { transition: none; } }
</style>

const fmtCache = new Map();
function fmt(tz) {

        timeZone: tz, hourCycle: "h23", year: "numeric", month: "numeric", day: "numeric",
        hour: "numeric", minute: "numeric", second: "numeric", weekday: "short" }));
    return fmtCache.get(tz);
}
// tz je ili ime zone (Intl, za pravi svijet u vremeplovu) ili broj minuta od UTC-a (uređaj)
function dijelovi(ms, tz) {
    if (typeof tz === "number") {
        const t = new Date(ms + tz * 60000);
        return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate(), h: t.getUTCHours(), min: t.getUTCMinutes(),
                 s: t.getUTCSeconds(), wd: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][t.getUTCDay()] };
    }
    const o = {};
    for (const p of fmt(tz).formatToParts(new Date(ms))) o[p.type] = p.value;
    return { y: +o.year, m: +o.month, d: +o.day, h: +o.hour, min: +o.minute, s: +o.second, wd: o.weekday };
}
// koliko je minuta lokalno vrijeme ispred UTC-a (Zagreb ljeti: +120)

    const p = dijelovi(ms, tz);
    return Math.round((Date.UTC(p.y, p.m - 1, p.d, p.h, p.min, p.s) - Math.floor(ms / 1000) * 1000) / 60000);
}
function lokalnoUUtc(y, m, d, minDana, tz) {
    const g = Date.UTC(y, m - 1, d, 0, minDana);
    let t = g - offsetMin(g, tz) * 60000;
    return g - offsetMin(t, tz) * 60000;
}
// uređaj ne zna pravila za ljetno vrijeme: korisnik ga sam uključi u izborniku

const PRAVA_ZONA = Intl.DateTimeFormat().resolvedOptions().timeZone;

}

function dodajDane(dt, n) {
    const t = new Date(Date.UTC(dt.y, dt.m - 1, dt.d) + n * DAN_MS);

function datumStanista(y, m, d, pomak) {

}

// ================= SUNCE (NOAA, pojednostavljeno) =================
function deklinacija(doy) {
    const g = 2 * Math.PI / 365 * (doy - 0.5);
    return 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g)
         + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
}
function jednadzbaVremena(doy) {
    const g = 2 * Math.PI / 365 * (doy - 0.5);
    return 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g)
         - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
}
// §2.6: lat staništa, lon doma
function elevacija(lat, dek, utcMin, eq, lon) {
    const ha = rad((utcMin + eq + 4 * lon) / 4 - 180);
    const z = Math.sin(rad(lat)) * Math.sin(dek) + Math.cos(rad(lat)) * Math.cos(dek) * Math.cos(ha);
    return deg(Math.asin(clamp(z, -1, 1)));
}

// PRIVREMENO (§3 otvoreno): jačina i boja iz elevacije
function svjetloIz(post, e, eMax, minZid) {
    if (post.nacin === "sunce") {
        const s = post.sunce;
        // pali se tek kad sunce izađe (−0.833° = izlazak); ispod toga mrak, bez svitanja
        // počinje od 5 %, jer LED na jako niskim postocima treperi ili skače
        const IZLAZAK = -0.833, MIN_JACINA = 0.05;
        if (e < IZLAZAK || eMax <= 0) return { j: 0, k: s.kelvin_min };
        let j = MIN_JACINA + (1 - MIN_JACINA) * Math.sin(rad(Math.max(0, e))) / Math.sin(rad(Math.max(eMax, 1)));
        j = clamp(j, 0, 1) * s.max_jacina;
        // boja se kreće između korisnikovih granica: najžuće nisko, najbjelje kad je sunce visoko
        const k = s.kelvin_min + (s.kelvin_max - s.kelvin_min) * clamp(e / Math.min(Math.max(eMax, 5), 35), 0, 1);
        return { j, k };
    }
    const { sad, prije, t } = trenutnaSekcija(post.rucno, minZid), r = post.rucno;
    const f = r.prijelaz_min ? clamp(t / r.prijelaz_min, 0, 1) : 1;
    return { j: prije.jacina + (sad.jacina - prije.jacina) * f, k: prije.kelvin + (sad.kelvin - prije.kelvin) * f };
}
// koji je dio dana sad (prije prvog početka vrijedi zadnji od jučer)
function trenutnaSekcija(r, minZid) {
    const S = r.sekcije, n = S.length;
    let i = n - 1;
    S.forEach((x, k) => { if (uMin(x.od) <= minZid) i = k; });
    return { sad: S[i], prije: S[(i - 1 + n) % n], iduca: S[(i + 1) % n], t: (minZid - uMin(S[i].od) + 1440) % 1440 };
}
// omjer WW:CW = boja, zbroj = jačina (HARDVER.md)
function kanali(j, k) {
    const x = clamp((1 / 2700 - 1 / k) / (1 / 2700 - 1 / 6500), 0, 1);
    return { ww: j * (1 - x), cw: j * x };
}
function kelvinRgb(K) {
    const t = K / 100;
    const r = t <= 66 ? 255 : 329.698727446 * Math.pow(t - 60, -0.1332047592);
    const g = t <= 66 ? 99.4708025861 * Math.log(t) - 161.1195681661 : 288.1221695283 * Math.pow(t - 60, -0.0755148492);
    const b = t >= 66 ? 255 : t <= 19 ? 0 : 138.5177312231 * Math.log(t - 10) - 305.0447927307;
    return [r, g, b].map(v => Math.round(clamp(v, 0, 255)));
}

// cijeli dan za graf i ekran (sat na zidu doma, korak 2 min)
const danCache = new Map();
function dan(post, y, m, d) {
    const kljuc = JSON.stringify([post, y, m, d]);
    if (danCache.has(kljuc)) return danCache.get(kljuc);
    const tz = zona(post);
    const o0 = offsetMin(lokalnoUUtc(y, m, d, 0, tz), tz), o1 = offsetMin(lokalnoUUtc(y, m, d, 1439, tz), tz);
    const ds = datumStanista(y, m, d, post.pomak_dana);
    const dek = deklinacija(danUGodini(ds.y, ds.m, ds.d));   // oblik dana: datum staništa
    const eq = jednadzbaVremena(danUGodini(y, m, d));        // kad je podne: pravi datum
    const tocke = [];
    for (let min = 0; min < 1440; min += 2) {
        const zid = Date.UTC(y, m - 1, d, 0, min);
        const off = o0 === o1 ? o0 : offsetMin(zid - o0 * 60000, tz);
        const utcMin = (((zid - off * 60000) / 60000) % 1440 + 1440) % 1440;
        tocke.push({ min, e: elevacija(post.staniste.lat, dek, utcMin, eq, post.dom.lon) });
    }
    let eMax = -90, podne = 720, izlazak = null, zalazak = null;
    tocke.forEach((t, i) => {
        if (t.e > eMax) { eMax = t.e; podne = t.min; }
        if (i) {
            const a = tocke[i - 1];
            // −0.833° = gornji rub sunca uz lom svjetla, kao u službenim tablicama
            const H0 = -0.833;
            if (a.e < H0 && t.e >= H0) izlazak = a.min + 2 * (H0 - a.e) / (t.e - a.e);
            if (a.e >= H0 && t.e < H0) zalazak = a.min + 2 * (a.e - H0) / (a.e - t.e);
        }
    });
    for (const t of tocke) Object.assign(t, svjetloIz(post, t.e, eMax, t.min));
    const r = { tocke, eMax, podne, izlazak, zalazak, ds, dek, eq, offsetZid: o0 };
    if (danCache.size > 60) danCache.clear();
    danCache.set(kljuc, r);
    return r;
}

function ekranLista({ naslov, korak, stavke: st, index = 0, opis, onOk, hint, natrag, pregled }) {

            for (let r = 0; r < Math.min(VID, n); r++) {

                c.fillStyle = DIM; c.fillRect(W - 16, 35 + (VID * 24 - 2) * od / n, 4, Math.max(8, (VID * 24 - 2) * VID / n));

function ekranBrojevi({ naslov, korak, polja, predlozak, napomena, onOk, pregled }) {
    let f = 0;
    const v = polja.map(p => p.v);
    const prikaz = k => (polja[k].fmt || pad)(v[k], v);
    function promijeni(k, smjer) {
        const p = polja[k], step = p.step || 1, max = typeof p.max === "function" ? p.max(v) : p.max,
              min = typeof p.min === "function" ? p.min(v) : p.min;

        if (n > max) n = p.wrap === false ? max : min;

    }
    return {
        crtaj() {
            zaglavlje(naslov, korak);
            const yy = predlozak.length > 2 ? 34 : 44, y0 = predlozak.length > 2 ? 58 : 76;
            predlozak.forEach((red, ri) => {

                const ukupno = komadi.reduce((s, t) => s + c.measureText(t).width, 0);

                    x += w;

        gore() { promijeni(f, 1); },
        dolje() { promijeni(f, -1); },

        pregled: pregled && (() => pregled(v, f)),       // dok biraš jačinu/boju, traka odmah to pokazuje

}

    const x = (Math.sin(rad(-0.833)) - Math.sin(rad(lat)) * Math.sin(dek)) / (Math.cos(rad(lat)) * Math.cos(dek));
    return x >= 1 ? 0 : x <= -1 ? 24 : 2 * deg(Math.acos(x)) / 15;

const fmtH = h => { let hh = Math.floor(h), mm = Math.round((h - hh) * 60); if (mm === 60) { hh++; mm = 0; } return `${hh} h ${pad(mm)}`; };

        const dt = dodajDane({ y, m: 1, d: 1 }, doy - 1), ds = datumStanista(dt.y, dt.m, dt.d, pomak);
        r.push({ doy, doma: latDom == null ? null : duljinaDana(latDom, deklinacija(doy)),
                 tamo: duljinaDana(latSt, deklinacija(danUGodini(ds.y, ds.m, ds.d))) });
    }

}

        c.strokeStyle = FG; c.lineWidth = 1.5; c.stroke();

    $("#led-sjaj").setAttribute("fill", boja);
    $("#led-sjaj").setAttribute("opacity", s ? 0.5 + 0.5 * a : 0);
    for (const [id, op] of [["#konus-1", 0.55 * a], ["#konus-2", 0.08 * a]]) {
        $(id).setAttribute("stop-color", boja); $(id).setAttribute("stop-opacity", op);
    }
    $("#tint").setAttribute("fill", boja);
    $("#tint").setAttribute("opacity", s ? 0.45 : 0);
    $("#tama").setAttribute("opacity", (0.9 * Math.pow(1 - a, 1.6)).toFixed(3));
}

// ================= DOBA DANA (klizač) =================
// pomiče svijet tako da sat uređaja pokaže odabrano vrijeme, isti dan
function postaviDobaDana(min) {
    const tz = tzUredaja(), sad = U.satOk ? uredajMs() : SIM.ms, p = dijelovi(sad, tz);
    const cilj = lokalnoUUtc(p.y, p.m, p.d, min, tz);
    SIM.ms = cilj - (U.satOk ? U.pomakSata : 0);
    osvjeziPanele();
}
{
    const k = $("#klizac");
    k.addEventListener("input", () => { vucem = true; postaviDobaDana(+k.value); });
    k.addEventListener("change", () => { vucem = false; });
    k.addEventListener("pointerup", () => { vucem = false; });
}

// ================= PETLJA =================
let zadnje = performance.now(), zadnjiPanel = 0;
function petlja(t) {
    const dt = (t - zadnje) / 1000; zadnje = t;
    if (!SIM.pauza) SIM.ms += dt * 1000 * SIM.brzina;
    c.fillStyle = BG; c.fillRect(0, 0, W, H);
    if (!U.gasen && U.ekran) U.ekran.crtaj();
    if (t - zadnjiPanel > 200) { zadnjiPanel = t; osvjeziPanele(); }
    requestAnimationFrame(petlja);
}
pocetak();
requestAnimationFrame(petlja);
</script>
